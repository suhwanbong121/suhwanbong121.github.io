name: Update Latest Papers

on:
  schedule:
    - cron: '*/1 * * * *' # Runs every minute
    # - cron: '0 0 * * *' # Runs every midnight
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Fetch latest arXiv papers
      run: |
        curl -s "http://export.arxiv.org/api/query?search_query=all:causal+inference&start=0&max_results=5" > papers.xml

    - name: Convert XML to JSON
      run: |
        python - <<EOF
        import xml.etree.ElementTree as ET
        import json

        tree = ET.parse('papers.xml')
        root = tree.getroot()

        ns = {'arxiv': 'http://www.w3.org/2005/Atom'}
        papers = []
        for entry in root.findall('arxiv:entry', ns):
            title = entry.find('arxiv:title', ns).text
            authors = [a.find('arxiv:name', ns).text for a in entry.findall('arxiv:author', ns)]
            summary = entry.find('arxiv:summary', ns).text
            link = entry.find('arxiv:id', ns).text

            papers.append({
                "title": title,
                "authors": ", ".join(authors),
                "summary": summary,
                "link": link
            })

        with open("papers.json", "w") as f:
            json.dump(papers, f, indent=4)
        EOF

    - name: Commit and push changes
      run: |
        git config --global user.name "suhwanbong121"
        git config --global user.email "suhwanbong121@gmail.com"
        git add papers.json
        git commit -m "Update arXiv papers"
        git push